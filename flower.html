    <style>
      .stars{ position:fixed; inset:0; pointer-events:none; z-index:1; }
      .star{
        position:absolute; border-radius:50%;
        background:#fff; box-shadow:0 0 6px 1px rgba(255,255,255,.8);
        animation: twinkle ease-in-out infinite;
      }
      @keyframes twinkle{ 0%,100%{opacity:.15;} 50%{opacity:1;} }

      .moon{
        position:fixed; top:8%; right:10%;
        width:70px; height:70px; border-radius:50%;
        background: radial-gradient(circle at 35% 35%, #fffef2, #ffe9b0 55%, #e8c877 100%);
        box-shadow: 0 0 40px 10px rgba(255,236,180,.35), 0 0 90px 30px rgba(255,236,180,.12);
        z-index:1; opacity:0;
        animation: moonIn 2.4s ease-out .3s forwards;
      }
      @keyframes moonIn{ to{ opacity:1; transform: translateY(0); } from{ transform: translateY(-14px); } }

      .fireflies{ position:fixed; inset:0; pointer-events:none; z-index:2; }
      .firefly{
        position:absolute; width:4px; height:4px; border-radius:50%;
        background:#bfffe0;
        box-shadow:0 0 8px 3px rgba(191,255,224,.9);
        animation: drift linear infinite, glow 2.4s ease-in-out infinite;
      }
      @keyframes drift{
        0%   { transform: translate(0,0); }
        25%  { transform: translate(20px,-24px); }
        50%  { transform: translate(-14px,-46px); }
        75%  { transform: translate(16px,-20px); }
        100% { transform: translate(0,0); }
      }
      @keyframes glow{ 0%,100%{ opacity:.25;} 50%{ opacity:1; } }

      .vignette{
        position:fixed; inset:0; pointer-events:none; z-index:3;
        background: radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,.55) 100%);
      }

      .flowers{ position:relative; z-index:2; }

      /* ===== Falling petals (fills empty space, extra elegant on tall phone screens) ===== */
      .petals{ position:fixed; inset:0; overflow:hidden; pointer-events:none; z-index:2; }
      .petal{
        position:absolute; top:-10%;
        border-radius: 70% 30% 60% 40% / 60% 40% 60% 40%;
        animation: petal-fall linear infinite;
      }
      .petal--rose{ background: radial-gradient(circle at 30% 30%, #ffe3ec, #ff8fab 70%); box-shadow:0 0 8px rgba(255,143,171,.5); }
      .petal--gold{ background: radial-gradient(circle at 30% 30%, #fff6df, #f6c667 70%); box-shadow:0 0 8px rgba(246,198,103,.5); }
      .petal--white{ background: radial-gradient(circle at 30% 30%, #ffffff, #d8f4ff 70%); box-shadow:0 0 8px rgba(216,244,255,.5); }
      @keyframes petal-fall{
        0%   { transform: translateY(-10vh) translateX(0) rotate(0deg); opacity:0; }
        8%   { opacity:.9; }
        92%  { opacity:.85; }
        100% { transform: translateY(110vh) translateX(var(--drift,30px)) rotate(360deg); opacity:0; }
      }

      /* ===== Make the bouquet rise higher & fuller on phone screens ===== */
      @media (max-width: 768px){
        .flowers{ transform: scale(1.5); transform-origin: bottom center; }
      }
      @media (max-width: 768px) and (max-aspect-ratio: 9/16){
        .flowers{ transform: scale(1.85); }
      }
    </style>

    <script>
      const starsWrap = document.getElementById('stars');
      for(let i=0;i<70;i++){
        const s = document.createElement('div');
        s.className = 'star';
        const size = Math.random()*2 + 1;
        s.style.width = size + 'px';
        s.style.height = size + 'px';
        s.style.left = Math.random()*100 + 'vw';
        s.style.top = Math.random()*55 + 'vh';
        s.style.animationDuration = (2 + Math.random()*3) + 's';
        s.style.animationDelay = (Math.random()*4) + 's';
        starsWrap.appendChild(s);
      }
      const fireflyWrap = document.getElementById('fireflies');
      for(let i=0;i<14;i++){
        const f = document.createElement('div');
        f.className = 'firefly';
        f.style.left = (10 + Math.random()*80) + 'vw';
        f.style.top = (35 + Math.random()*45) + 'vh';
        f.style.animationDuration = (6 + Math.random()*6) + 's, ' + (2 + Math.random()*2) + 's';
        f.style.animationDelay = (Math.random()*5) + 's';
        fireflyWrap.appendChild(f);
      }

      const petalWrap = document.getElementById('petals');
      const petalColors = ['petal--rose', 'petal--gold', 'petal--white'];
      const petalTotal = window.innerWidth < 768 ? 26 : 16;
      for(let i=0;i<petalTotal;i++){
        const p = document.createElement('div');
        p.className = 'petal ' + petalColors[Math.floor(Math.random()*petalColors.length)];
        const size = 6 + Math.random()*9;
        const duration = 9 + Math.random()*10;
        const delay = Math.random()*12;
        const drift = (Math.random()*90 - 45) + 'px';
        p.style.left = Math.random()*100 + 'vw';
        p.style.width = size + 'px';
        p.style.height = size + 'px';
        p.style.animationDuration = duration + 's';
        p.style.animationDelay = delay + 's';
        p.style.setProperty('--drift', drift);
        petalWrap.appendChild(p);
      }
