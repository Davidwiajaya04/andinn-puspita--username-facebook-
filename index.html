<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,500&family=Poppins:wght@300;400;500;600&display=swap">
<link rel="icon" href="img/flowers.png" type="image/x-icon">
<title>Untuk Andin Pertamasari</title>
<style>
  :root{
    --rose: #ff8fab;
    --rose-deep: #e85d75;
    --cream: #fff1e6;
    --gold: #f6c667;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    font-family:'Poppins', sans-serif;
    background: linear-gradient(160deg,#3a1c2e 0%, #6c2b4d 35%, #b1466e 70%, #f0879f 100%);
    overflow:hidden;
    color:#fff;
  }
  .stage{
    position:relative;
    width:100%; height:100vh;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    text-align:center;
    padding:24px;
  }

  /* soft glowing orbs in background */
  .orb{
    position:absolute; border-radius:50%;
    filter:blur(50px); opacity:.5; pointer-events:none;
  }
  .orb1{ width:340px; height:340px; background:var(--rose); top:-80px; left:-100px; }
  .orb2{ width:280px; height:280px; background:var(--gold); bottom:-100px; right:-80px; }

  /* falling petals */
  .petals{ position:absolute; inset:0; overflow:hidden; pointer-events:none; }
  .petal{
    position:absolute; top:-10%;
    width:14px; height:14px;
    background: radial-gradient(circle at 30% 30%, #ffe3ec, var(--rose) 70%);
    border-radius: 70% 30% 60% 40% / 60% 40% 60% 40%;
    animation: fall linear infinite;
    opacity:.85;
  }
  @keyframes fall{
    0%   { transform: translateY(-10vh) translateX(0) rotate(0deg); }
    100% { transform: translateY(110vh) translateX(var(--drift,30px)) rotate(360deg); }
  }

  .eyebrow{
    letter-spacing:4px; font-size:12px; text-transform:uppercase;
    color:var(--gold); opacity:0; font-weight:500;
    animation: riseIn .9s ease-out .2s forwards;
  }

  .name-wrap{ margin:14px 0 6px; }
  .name-wrap span{
    display:inline-block;
    font-family:'Cormorant Garamond', serif;
    font-style:italic; font-weight:600;
    font-size:clamp(38px, 9vw, 78px);
    background: linear-gradient(180deg, #fff 10%, var(--cream) 55%, var(--gold) 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow: 0 6px 24px rgba(0,0,0,.25);
    opacity:0; transform: translateY(24px);
    animation: riseIn .8s cubic-bezier(.2,.8,.2,1) forwards;
  }
  @keyframes riseIn{ to{ opacity:1; transform:translateY(0);} }

  .line{
    width:64px; height:2px; margin:18px auto;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    opacity:0; animation: riseIn .8s ease-out 1.1s forwards;
  }

  .description{
    max-width:420px; opacity:0;
    animation: riseIn .8s ease-out 1.3s forwards;
  }
  .description .lead{
    font-family:'Cormorant Garamond', serif;
    font-size:24px; font-style:italic; font-weight:500;
    color:#fff;
  }
  .description .sub{
    margin-top:8px; font-size:14px; font-weight:300;
    color:rgba(255,255,255,.85); line-height:1.7;
    letter-spacing:.3px;
  }

  .button{
    margin-top:34px; opacity:0;
    animation: riseIn .8s ease-out 1.6s forwards;
  }
  .button a{ text-decoration:none; }
  .button button{
    position:relative;
    background: linear-gradient(135deg, #fff, var(--cream));
    border:none; padding:16px 42px;
    font-size:14px; letter-spacing:2.5px;
    border-radius:50px; cursor:pointer;
    font-weight:600; color:var(--rose-deep);
    text-transform:uppercase;
    box-shadow: 0 10px 30px rgba(0,0,0,.28), 0 0 0 1px rgba(255,255,255,.4) inset;
    transition: transform .35s ease, box-shadow .35s ease, color .35s ease, background .35s ease;
  }
  .button button:hover{
    transform: translateY(-3px) scale(1.05);
    background: linear-gradient(135deg, var(--rose-deep), #c93f63);
    color:#fff;
    box-shadow: 0 16px 34px rgba(0,0,0,.35);
  }
  .button .hint{
    display:block; margin-top:12px; font-size:11px;
    letter-spacing:1.5px; color:rgba(255,255,255,.6);
    text-transform:uppercase; font-weight:300;
  }

  .sparkle{
    position:absolute; width:5px; height:5px; background:#fff; border-radius:50%;
    opacity:0; animation: twinkle 2.6s ease-in-out infinite;
    box-shadow:0 0 8px 2px rgba(255,255,255,.8);
  }
  @keyframes twinkle{ 0%,100%{opacity:0;} 50%{opacity:1;} }
</style>
</head>
<body>
  <div class="stage">
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
    <div class="petals" id="petals"></div>

    <div class="eyebrow">Untuk</div>

    <div class="name-wrap">
      <span style="animation-delay:.25s">Andin</span>
      <span style="animation-delay:.45s">Pertamasari</span>
    </div>

    <div class="line"></div>

    <div class="description">
      <div class="lead">Semangat, Andin</div>
      <div class="sub">Ada sesuatu untukmu di halaman berikutnya.</div>
    </div>

    <div class="button">
      <a href="flower.html">
        <button>Lihat</button>
      </a>
    </div>
  </div>

<script>
  const petalWrap = document.getElementById('petals');
  const total = 22;
  for(let i=0;i<total;i++){
    const p = document.createElement('div');
    p.className = 'petal';
    const left = Math.random()*100;
    const duration = 7 + Math.random()*8;
    const delay = Math.random()*10;
    const size = 8 + Math.random()*10;
    const drift = (Math.random()*80 - 40) + 'px';
    p.style.left = left + 'vw';
    p.style.width = size + 'px';
    p.style.height = size + 'px';
    p.style.animationDuration = duration + 's';
    p.style.animationDelay = delay + 's';
    p.style.setProperty('--drift', drift);
    petalWrap.appendChild(p);
  }
  const sparkleCount = 30;
  for(let i=0;i<sparkleCount;i++){
    const s = document.createElement('div');
    s.className = 'sparkle';
    s.style.left = Math.random()*100 + 'vw';
    s.style.top = Math.random()*100 + 'vh';
    s.style.animationDelay = (Math.random()*3) + 's';
    s.style.animationDuration = (2 + Math.random()*3) + 's';
    document.querySelector('.stage').appendChild(s);
  }
</script>
</body>
</html>
